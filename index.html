<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的電子書房</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{
  --bg:#0e1014;--panel:#161920;--card:#1c2029;--card2:#242935;--line:#2b303c;
  --text:#eceef3;--muted:#9aa3b4;--faint:#6b7385;
  --accent:#ff8a65;--accent-ink:#2a120a;--blue:#6ea8ff;--danger:#ff6b6b;--ok:#4cd39b;
  --radius:14px;--shadow:0 12px 40px rgba(0,0,0,.5);--top:62px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select{font:inherit;color:inherit}
.icon-btn{width:40px;height:40px;border-radius:10px;display:inline-grid;place-items:center;font-size:22px;flex:none}
.icon-btn:hover,.icon-btn.on{background:var(--card2)}
.icon-btn.on{color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-size:14px}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn .ti{font-size:18px}

/* 頂部列 */
.topbar{position:sticky;top:0;z-index:20;height:var(--top);display:flex;align-items:center;gap:12px;padding:0 16px;background:rgba(14,16,20,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:20px;flex:none}
.brand b{display:block;font-size:16px;white-space:nowrap}
.brand small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.search{flex:1;max-width:420px;margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0 10px;height:40px}
.search .ti{color:var(--faint);font-size:18px}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:14px}
@media(max-width:560px){.brand small{display:none}.brand b{font-size:15px}}

main{max-width:1280px;margin:0 auto;padding:16px 16px 40px}
.stats{color:var(--muted);font-size:13px;margin:4px 2px 14px;min-height:18px}

/* Accordion 摺疊面板 */
.acc{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);margin-bottom:12px;scroll-margin-top:calc(var(--top) + 12px)}
.acc-head{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left;border-radius:var(--radius)}
.acc-head:hover{background:rgba(255,255,255,.02)}
.acc-title b{display:block;font-size:16px}
.acc-title small{color:var(--muted);font-size:12px}
.chev{margin-left:auto;font-size:20px;color:var(--muted);transition:transform .25s}
.acc.open .chev{transform:rotate(180deg)}
.acc-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.acc.open .acc-body{grid-template-rows:1fr}
.acc-inner{overflow:hidden}
.avatar{width:36px;height:36px;border-radius:50%;background:rgba(255,138,101,.16);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:none}
.avatar.sm{width:28px;height:28px;font-size:13px}

/* 圖卡 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding:4px 14px 16px}
@media(max-width:420px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:4px 10px 12px}}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s;outline:0}
.card:hover,.card:focus-visible{transform:translateY(-2px);border-color:var(--faint)}
.cover{position:relative;aspect-ratio:3/4;background:#11141a;display:grid;place-items:center;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .ph{font-size:44px;color:var(--faint)}
.bdgs{position:absolute;left:6px;bottom:6px;display:flex;gap:4px;flex-wrap:wrap}
.bdg{display:inline-flex;align-items:center;gap:3px;font-size:11px;padding:2px 7px;border-radius:999px;background:rgba(0,0,0,.65);color:#fff}
.bdg .ti{font-size:13px}
.bdg.pdf{color:#ffb4a2}.bdg.vid{color:#9ec5ff}
.cmeta{padding:8px 34px 10px 10px}
.ctitle{font-size:13px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:35px}
.csub{font-size:11px;color:var(--faint);margin-top:4px}
.kebab{position:absolute;right:2px;bottom:6px;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-size:20px;color:var(--muted)}
.kebab:hover{background:var(--card2);color:var(--text)}

/* Skeleton 骨架屏 */
.sk{display:block;border-radius:8px;background:linear-gradient(90deg,#1b1f27 25%,#272c38 37%,#1b1f27 63%);background-size:400% 100%;animation:sh 1.3s ease infinite}
@keyframes sh{0%{background-position:100% 0}100%{background-position:0 0}}
.sk-av{width:36px;height:36px;border-radius:50%}
.sk-line{height:12px;margin:8px 10px 0;width:80%}
.sk-line.short{width:45%;margin-bottom:10px}
.stats .sk-line{margin:0;display:inline-block}
.sk-card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sk-cover{aspect-ratio:3/4;border-radius:0}

.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty .ti{font-size:52px;color:var(--faint)}
.empty p{font-size:16px;color:var(--text)}
.empty .btn{margin-top:14px}

/* Hamburger 抽屜 */
.drawer-ov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s}
.drawer-ov.open{opacity:1;pointer-events:auto}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(340px,88vw);background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .28s ease}
.drawer-ov.open .drawer{transform:none}
.dr-head{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 12px 18px;border-bottom:1px solid var(--line)}
.dr-head b{font-size:16px}
.dr-sec{padding:14px 18px;border-bottom:1px solid var(--line)}
.dr-sec h4{margin:0 0 10px;font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.04em}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{flex:1;padding:7px 4px;border-radius:7px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--card2);color:var(--text)}
.row{display:flex;gap:8px}
.row .btn{flex:1}
.name-index{flex:1;overflow:auto;padding:8px 10px}
.ni{width:100%;display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;text-align:left;font-size:14px}
.ni:hover{background:var(--card)}
.ni span:nth-child(2){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ni small{color:var(--faint)}
.link-in{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:13px;outline:0;margin-bottom:8px}

/* Modal 彈出視窗 */
.modal{position:fixed;inset:0;z-index:50;background:rgba(6,7,10,.92);display:none;align-items:center;justify-content:center}
.modal.open{display:flex;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.mbox{width:100%;height:100%;display:flex;flex-direction:column}
.mtop{display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top))}
.mtitle{flex:1;min-width:0;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:4px}
.mtop select{max-width:38vw;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:8px}
.flipbox{margin:auto}
.page{background:#0a0b0e;position:relative;overflow:hidden}
.page>img,.page>canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.pg-ph{position:absolute;inset:0;display:grid;place-items:center}
.pg-no{position:absolute;right:8px;bottom:6px;font-size:11px;color:rgba(255,255,255,.45);z-index:2}
.rbar{display:flex;align-items:center;gap:10px;padding:10px 14px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.rbar input[type=range]{flex:1;accent-color:var(--accent)}
.pnum{font-size:13px;color:var(--muted);min-width:76px;text-align:center;font-variant-numeric:tabular-nums}
.loading{display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--muted);text-align:center;padding:20px}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
.spinner.sm{width:22px;height:22px;border-width:2px}
@keyframes spin{to{transform:rotate(360deg)}}

/* 影片播放器 */
.pbody{flex:1;min-height:0;display:flex;gap:16px;padding:0 16px 16px;max-width:1400px;width:100%;margin:0 auto}
.vwrap{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:10px}
.vwrap video{width:100%;max-height:calc(100vh - 150px);background:#000;border-radius:12px}
.pnow{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plside{width:300px;flex:none;overflow:auto;margin:0;padding:0;list-style:none;align-self:stretch}
@media(max-width:899px){.plside{display:none}.pbody{padding:0 0 12px}.vwrap video{border-radius:0}.pnow{padding:0 14px}}
@media(min-width:900px){#btnPl{display:none}}
.pl-item{width:100%;display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;text-align:left}
.pl-item:hover{background:var(--card)}
.pl-item.on{background:var(--card2);outline:1px solid var(--accent)}
.pl-item img,.pl-item>.ti{width:80px;height:46px;border-radius:6px;object-fit:cover;background:#000;flex:none;display:grid;place-items:center;font-size:22px;color:var(--faint)}
.pl-item span{flex:1;min-width:0;font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pl-item small{color:var(--faint);font-size:11px;flex:none}

/* Bottom Sheet 底部面板 */
.sheet-ov{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s}
.sheet-ov.open{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:620px;max-height:82vh;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .3s ease;padding-bottom:env(safe-area-inset-bottom)}
.sheet.dragging{transition:none}
.sheet-ov.open .sheet{transform:none}
.handle{padding:10px 0 6px;display:grid;place-items:center;cursor:grab;touch-action:none}
.handle::before{content:"";width:42px;height:5px;border-radius:3px;background:var(--faint)}
.sheet-body{overflow:auto;padding:4px 18px 20px}
.sh-title{margin:4px 0 12px;font-size:17px;line-height:1.4}
.sh-sub{margin:16px 0 8px;font-size:13px;color:var(--muted);font-weight:500}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.flist{list-style:none;margin:0;padding:0}
.flist>li>button:not(.pl-item){width:100%;display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;text-align:left;font-size:14px}
.flist>li>button:not(.pl-item):hover{background:var(--card)}
.flist span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flist small{color:var(--faint)}
.sh-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.sh-actions .btn{flex:1;min-width:110px}

/* Kebab 三點選單 */
.kmenu{position:fixed;z-index:90;min-width:200px;background:var(--card2);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:none}
.kmenu.open{display:block;animation:fade .12s ease}
.kitem{width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;font-size:14px;text-align:left}
.kitem:hover{background:rgba(255,255,255,.06)}
.kitem .ti{font-size:18px;color:var(--muted)}

/* Toast 浮動通知 */
.toasts{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;width:max-content;max-width:92vw}
.toast{display:flex;align-items:center;gap:8px;background:#f2f3f6;color:#15171c;padding:10px 16px;border-radius:12px;font-size:14px;box-shadow:var(--shadow);animation:tin .25s ease}
.toast .ti{font-size:18px}
.toast.ok .ti{color:#14945f}.toast.err .ti{color:#d63c3c}
.toast.out{opacity:0;transform:translateY(8px);transition:.3s}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

footer{text-align:center;color:var(--faint);font-size:12px;padding:10px 16px 30px}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo"><i class="ti ti-books"></i></div>
    <div style="min-width:0"><b id="siteTitle">我的電子書房</b><small id="folderName">讀取雲端資料夾中…</small></div>
  </div>
  <label class="search"><i class="ti ti-search"></i><input id="q" type="search" placeholder="搜尋人名或作品" autocomplete="off"></label>
  <button class="icon-btn" id="btnMenu" aria-label="開啟選單"><i class="ti ti-menu-2"></i></button>
</header>

<main>
  <div class="stats" id="stats"></div>
  <div id="list"></div>
</main>
<footer id="footer"></footer>

<!-- Hamburger 抽屜選單 -->
<div class="drawer-ov" id="drawerOv">
  <aside class="drawer" role="dialog" aria-label="選單">
    <div class="dr-head"><b>人名索引</b><button class="icon-btn" id="btnCloseDrawer" aria-label="關閉"><i class="ti ti-x"></i></button></div>
    <div class="dr-sec">
      <h4>排序方式</h4>
      <div class="seg" id="sortSeg">
        <button data-sort="name-asc">人名 A→Z</button>
        <button data-sort="name-desc">人名 Z→A</button>
        <button data-sort="recent">最新更新</button>
      </div>
      <div class="row" style="margin-top:10px">
        <button class="btn" id="btnExpand"><i class="ti ti-arrows-maximize"></i>全部展開</button>
        <button class="btn" id="btnCollapse"><i class="ti ti-arrows-minimize"></i>全部收合</button>
      </div>
    </div>
    <nav class="name-index" id="nameIndex"></nav>
    <div class="dr-sec" style="border-top:1px solid var(--line);border-bottom:0">
      <h4>pCloud 公開連結</h4>
      <input class="link-in" id="linkIn" type="url" placeholder="https://e.pcloud.link/publink/show?code=…">
      <button class="btn primary" id="btnReload" style="width:100%"><i class="ti ti-refresh"></i>重新載入</button>
    </div>
  </aside>
</div>

<!-- Modal：電子書翻閱 -->
<div class="modal" id="reader" role="dialog" aria-label="電子書">
  <div class="mbox">
    <div class="mtop">
      <div class="mtitle" id="rTitle"></div>
      <select id="srcSel" hidden aria-label="選擇版本"></select>
      <button class="icon-btn" id="btnHQ" aria-label="高畫質原圖" title="高畫質原圖"><i class="ti ti-hd"></i></button>
      <button class="icon-btn" id="btnRInfo" aria-label="作品資訊"><i class="ti ti-info-circle"></i></button>
      <button class="icon-btn" id="btnRClose" aria-label="關閉"><i class="ti ti-x"></i></button>
    </div>
    <div class="stage" id="stage"></div>
    <div class="rbar">
      <button class="icon-btn" id="btnPrev" aria-label="上一頁"><i class="ti ti-chevron-left"></i></button>
      <input type="range" id="pageRange" min="0" max="0" value="0" step="1" aria-label="跳頁">
      <span class="pnum" id="pageNum">0 / 0</span>
      <button class="icon-btn" id="btnNext" aria-label="下一頁"><i class="ti ti-chevron-right"></i></button>
    </div>
  </div>
</div>

<!-- Modal：影片播放 -->
<div class="modal" id="player" role="dialog" aria-label="影片播放">
  <div class="mbox">
    <div class="mtop">
      <div class="mtitle" id="pTitle"></div>
      <button class="icon-btn" id="btnPl" aria-label="播放清單"><i class="ti ti-playlist"></i></button>
      <button class="icon-btn" id="btnPInfo" aria-label="作品資訊"><i class="ti ti-info-circle"></i></button>
      <button class="icon-btn" id="btnPClose" aria-label="關閉"><i class="ti ti-x"></i></button>
    </div>
    <div class="pbody">
      <div class="vwrap">
        <video id="vid" controls playsinline preload="metadata"></video>
        <div class="pnow" id="pNow"></div>
      </div>
      <ol class="plside" id="plSide"></ol>
    </div>
  </div>
</div>

<!-- Bottom Sheet -->
<div class="sheet-ov" id="sheetOv">
  <div class="sheet" id="sheet" role="dialog">
    <div class="handle" id="sheetHandle" aria-label="拖曳關閉"></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<div class="kmenu" id="kmenu" role="menu"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script>
/* ===================== 設定區 ===================== */
const CONFIG = {
  // 預設讀取的 pCloud 公開資料夾連結（也可用網址 ?link=… 或選單裡貼上新連結）
  shareLink: 'https://e.pcloud.link/publink/show?code=kZQFzX7Z6lm7KwCuop5tnJBTjFP62VbsU2sk',
  siteTitle: '我的電子書房',
  // 不顯示的檔案
  exclude: /掃毒證明|簡介|說明|readme|\.(rtf|txt|nfo|url|db|ini|ds_store)$/i,
  // 人名自動判斷錯誤時手動指定：'作品資料夾原名': '人名'
  nameOverrides: {},
  version: 'v1.0.0',
  updated: '2026-10-20'
};

/* ===================== 工具 ===================== */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const coll = new Intl.Collator('zh-Hant-TW', { numeric: true, sensitivity: 'base' });
const RX = { img: /\.(jpe?g|png|webp|gif|bmp|avif)$/i, pdf: /\.pdf$/i, vid: /\.(mp4|m4v|mov|webm|mkv|avi|wmv|flv|ts|3gp|mpe?g)$/i };
const S = { code: '', api: '', link: '', works: [], byId: new Map(), sort: 'name-asc', q: '', openSet: new Set(), linkCache: new Map() };

function store(k, v) {
  try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; }
}
function fmtSize(b) {
  if (!b) return '—';
  const u = ['B','KB','MB','GB','TB']; let i = 0;
  while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
  return (i ? b.toFixed(b < 10 ? 1 : 0) : b) + ' ' + u[i];
}
function fmtDate(t) {
  if (!t) return '—';
  const d = new Date(t);
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
}
function syncLock() {
  document.body.classList.toggle('lock', !!document.querySelector('.modal.open,.drawer-ov.open,.sheet-ov.open'));
}

/* ===================== Toast ===================== */
function toast(msg, type = '') {
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  const ic = type === 'err' ? 'ti-alert-circle' : type === 'ok' ? 'ti-circle-check' : 'ti-info-circle';
  t.innerHTML = `<i class="ti ${ic}"></i><span>${esc(msg)}</span>`;
  $('#toasts').appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 300); }, type === 'err' ? 4500 : 2600);
}

/* ===================== pCloud API ===================== */
function parseLink(link) {
  const u = new URL(link.trim());
  const code = u.searchParams.get('code');
  if (!code) throw new Error('連結裡找不到 code 參數');
  const eu = /^e\./i.test(u.hostname) || /eapi/i.test(u.hostname);
  return { code, api: eu ? 'https://eapi.pcloud.com' : 'https://api.pcloud.com' };
}
async function pc(method, params = {}) {
  const qs = new URLSearchParams({ code: S.code, ...params });
  const r = await fetch(`${S.api}/${method}?${qs}`);
  const j = await r.json();
  if (j.result !== 0) throw new Error(j.error || `pCloud 錯誤碼 ${j.result}`);
  return j;
}
// 縮圖：寬高需為 4 或 5 的倍數，上限 2048x1024
const thumb = (f, size = '320x480') =>
  `${S.api}/getpubthumb?${new URLSearchParams({ code: S.code, fileid: f.fileid, size, crop: '0' })}`;
async function fileLink(f, dl = false) {
  const key = f.fileid + (dl ? 'd' : '');
  if (S.linkCache.has(key)) return S.linkCache.get(key);
  const j = await pc('getpublinkdownload', dl ? { fileid: f.fileid, forcedownload: 1 } : { fileid: f.fileid });
  const url = 'https://' + j.hosts[0] + j.path;
  S.linkCache.set(key, url);

}
const zipUrl = w =>
  `${S.api}/getpubzip?${new URLSearchParams({ code: S.code, folderid: w.folderid, filename: (w.display || 'download') + '.zip', forcedownload: 1 })}`;

/* ===================== 資料整理 ===================== */
function kind(f) {
  const ct = f.contenttype || '';
  if (RX.pdf.test(f.name) || ct === 'application/pdf') return 'pdf';
  if (f.category === 2 || RX.vid.test(f.name) || ct.startsWith('video/')) return 'vid';
  if (f.category === 1 || RX.img.test(f.name) || ct.startsWith('image/')) return 'img';
  return null;
}
function collect(node, acc) {
  for (const c of node.contents || []) {
    if (c.isfolder) collect(c, acc);
    else if (!CONFIG.exclude.test(c.name)) { const k = kind(c); if (k) acc[k].push(c); }
  }
  return acc;
}
function cleanTitle(t) {
  return t.replace(/\[[^\]]*\]|【[^】]*】|《[^》]*檔》|\([^)]*\)|（[^）]*）/g, ' ').replace(/\s+/g, ' ').trim();
}
const KW = /(數位|数位|數碼|電子|电子)?(寫真書|寫真集|写真集|写真書|寫真|写真|photo ?book)/i;
function extractName(title) {
  if (CONFIG.nameOverrides[title]) return CONFIG.nameOverrides[title];
  const s = cleanTitle(title).replace(/日本版|台灣版|中文版|\b\d+(st|nd|rd|th)\b|\d+\s*P\b/gi, ' ');
  let name = '';
  const m = s.match(KW);
  if (m && m.index > 0) {
    const seg = s.slice(0, m.index).split(/[》」』\]】:：|｜\-–—_\s]+/).filter(Boolean);
    name = seg[seg.length - 1] || '';
  }
  if (!name) {
    const s2 = s.replace(/《[^》]*》|「[^」]*」|『[^』]*』/g, ' ').trim();
    name = (s2.split(/\s+[-–—|｜]\s+|[:：]|\s{2,}/)[0] || '').trim();
  }
  name = name.replace(/^[\s\-–—·・.,，]+|[\s\-–—·・.,，]+$/g, '');
  return name || cleanTitle(title) || title;
}
function medianRatio(files) {
  const r = files.filter(f => f.width && f.height).slice(0, 40).map(f => f.width / f.height).sort((a, b) => a - b);
  return r.length ? r[Math.floor(r.length / 2)] : 0.75;
}
function buildWorks(meta) {
  const works = [];
  const sorter = (a, b) => coll.compare(a.name, b.name);
  const add = (title, node, acc) => {
    acc.img.sort(sorter); acc.pdf.sort(sorter); acc.vid.sort(sorter);
    const all = [...acc.img, ...acc.pdf, ...acc.vid];
    if (!all.length) return;
    works.push({
      id: 'w' + works.length, title, display: cleanTitle(title) || title, name: extractName(title),
      folderid: node.isfolder ? node.folderid : null, file: node.isfolder ? null : node,
      img: acc.img, pdf: acc.pdf, vid: acc.vid,
      size: all.reduce((s, f) => s + (f.size || 0), 0),
      modified: Math.max(Date.parse(node.modified) || 0, ...all.map(f => Date.parse(f.modified) || 0)),
      cover: acc.img[0] || acc.vid.find(v => v.thumb) || acc.pdf.find(p => p.thumb) || null
    });
  };
  const empty = () => ({ img: [], pdf: [], vid: [] });
  if (!meta.isfolder) {
    const acc = empty(); const k = kind(meta); if (k) acc[k].push(meta);
    add(meta.name.replace(/\.[^.]+$/, ''), meta, acc);
    return works;
  }
  const rootImgs = empty();
  for (const c of meta.contents || []) {
    if (c.isfolder) { add(c.name, c, collect(c, empty())); continue; }
    if (CONFIG.exclude.test(c.name)) continue;
    const k = kind(c); if (!k) continue;
    if (k === 'img') rootImgs.img.push(c);
    else { const acc = empty(); acc[k].push(c); add(c.name.replace(/\.[^.]+$/, ''), c, acc); }
  }
  if (rootImgs.img.length) add(meta.name, meta, rootImgs);
  return works;
}
function getGroups() {
  const q = S.q.trim().toLowerCase();
  const list = S.works.filter(w => !q || w.name.toLowerCase().includes(q) || w.title.toLowerCase().includes(q));
  const m = new Map();
  for (const w of list) { if (!m.has(w.name)) m.set(w.name, []); m.get(w.name).push(w); }
  const g = [...m].map(([name, ws]) => ({
    name, works: ws.sort((a, b) => coll.compare(a.display, b.display)), latest: Math.max(...ws.map(w => w.modified))
  }));
  if (S.sort === 'name-asc') g.sort((a, b) => coll.compare(a.name, b.name));
  else if (S.sort === 'name-desc') g.sort((a, b) => coll.compare(b.name, a.name));
  else g.sort((a, b) => b.latest - a.latest);
  return g;
}

/* ===================== 載入 ===================== */
async function load() {
  showSkeleton();
  $('#folderName').textContent = '讀取雲端資料夾中…';
  try {
    const p = parseLink(S.link);
    S.code = p.code; S.api = p.api; S.linkCache.clear();
    const j = await pc('showpublink');
    S.works = buildWorks(j.metadata);
    S.byId = new Map(S.works.map(w => [w.id, w]));
    $('#folderName').textContent = j.metadata.name || 'pCloud 資料夾';
    S.openSet = new Set();
    const g = getGroups();
    g.slice(0, g.length <= 12 ? g.length : 3).forEach(x => S.openSet.add(x.name));
    render();
    toast(`已載入 ${g.length} 位、${S.works.length} 部作品`, 'ok');
  } catch (e) {
    console.error(e);
    $('#stats').textContent = '';
    $('#folderName').textContent = '讀取失敗';
    $('#list').innerHTML = `<div class="empty"><i class="ti ti-cloud-off"></i><p>讀取雲端資料夾失敗</p><small>${esc(e.message)}</small><br><button class="btn primary" id="btnRetry"><i class="ti ti-refresh"></i>重試</button></div>`;
    $('#btnRetry').onclick = load;

}

/* ===================== 電子書閱讀器（PageFlip + PDF.js） ===================== */
const R = { pf: null, w: null, srcs: [], src: null, pages: [], ratio: .75, count: 0, ph: 0, pdf: null, hq: false, busy: new Set(), done: new Set() };
let pdfReady = null;
function ensurePdfJs() {
  if (window.pdfjsLib) return Promise.resolve();
  return pdfReady ||= new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload = () => { pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; res(); };
    s.onerror = () => { pdfReady = null; rej(new Error('PDF 閱讀元件載入失敗')); };
    document.head.appendChild(s);
  });
}
function sourcesOf(w) {
  const s = [];
  if (w.img.length) s.push({ type: 'img', label: `圖片版（${w.img.length} 頁）`, files: w.img });
  w.pdf.forEach(f => s.push({ type: 'pdf', label: f.name, file: f }));
  return s;
}
function openReader(w, idx) {
  closeKebab(); closeSheet();
  R.w = w; R.srcs = sourcesOf(w);
  if (idx == null) idx = w.pdf.length ? (w.img.length ? 1 : 0) : 0;
  const sel = $('#srcSel');
  sel.innerHTML = R.srcs.map((s, i) => `<option value="${i}">${esc(s.label)}</option>`).join('');
  sel.hidden = R.srcs.length < 2; sel.value = idx;
  $('#rTitle').textContent = w.display;
  $('#reader').classList.add('open'); syncLock();
  loadSource(R.srcs[idx]);
}
function destroyFlip() { try { R.pf && R.pf.destroy(); } catch (e) {} R.pf = null; }
function closeReader() {
  destroyFlip();
  if (R.pdf) { R.pdf.destroy(); R.pdf = null; }
  R.src = null; $('#stage').innerHTML = '';
  $('#reader').classList.remove('open'); syncLock();
}
async function loadSource(src) {
  destroyFlip();
  if (R.pdf) { R.pdf.destroy(); R.pdf = null; }
  R.src = src; R.done.clear(); R.busy.clear(); R.hq = false;
  $('#btnHQ').classList.remove('on'); $('#btnHQ').hidden = src.type !== 'img';
  const stage = $('#stage');
  stage.innerHTML = '<div class="loading"><div class="spinner"></div><p>載入中…</p></div>';
  try {
    if (src.type === 'img') { R.ratio = medianRatio(src.files); R.count = src.files.length; }
    else {
      await ensurePdfJs();
      const url = await fileLink(src.file);
      const doc = await pdfjsLib.getDocument({ url }).promise;
      if (R.src !== src) { doc.destroy(); return; }
      R.pdf = doc;
      const vp = (await doc.getPage(1)).getViewport({ scale: 1 });
      R.ratio = vp.width / vp.height; R.count = doc.numPages;
    }
    buildFlip(0);
  } catch (err) {
    console.error(err);
    if (R.src !== src) return;
    const isPdf = src.type === 'pdf';
    stage.innerHTML = `<div class="loading"><i class="ti ti-alert-triangle" style="font-size:42px;color:var(--danger)"></i>
      <p>${isPdf ? '這個 PDF 無法在網頁內翻閱（雲端主機可能不允許跨網域讀取）' : '載入失敗'}</p>
      ${isPdf ? '<button class="btn primary" id="btnOpenPdf"><i class="ti ti-external-link"></i>改用新分頁開啟</button>' : ''}</div>`;
    if (isPdf) $('#btnOpenPdf').onclick = () => fileLink(src.file).then(u => window.open(u, '_blank', 'noopener'));
    toast('載入失敗：' + err.message, 'err');
  }
}
function buildFlip(start = 0) {
  const stage = $('#stage'); stage.innerHTML = '';
  const aw = stage.clientWidth - 16, ah = stage.clientHeight - 16, r = R.ratio;
  const spread = R.count > 1 && aw > 700 && aw >= ah * r * 2 * 0.8;
  let ph = spread ? Math.min(ah, aw / 2 / r) : Math.min(ah, aw / r);
  const pw = Math.floor(ph * r); ph = Math.floor(ph); R.ph = ph;
  const box = document.createElement('div');
  box.className = 'flipbox';
  box.style.width = (spread ? pw * 2 : pw) + 'px';
  box.style.height = ph + 'px';
  stage.appendChild(box);
  R.pages = [];
  for (let i = 0; i < R.count; i++) {
    const d = document.createElement('div');
    d.className = 'page';
    d.innerHTML = `<div class="pg-ph"><div class="spinner sm"></div></div><span class="pg-no">${i + 1}</span>`;
    box.appendChild(d); R.pages.push(d);
  }
  R.pf = new St.PageFlip(box, {
    width: pw, height: ph, size: 'fixed', autoSize: false, showCover: spread, usePortrait: true,
    mobileScrollSupport: false, maxShadowOpacity: .4, flippingTime: 600, startPage: start
  });
  R.pf.loadFromHTML(R.pages);
  R.pf.on('flip', e => onPage(e.data));
  $('#pageRange').max = R.count - 1;
  onPage(start);
}
function onPage(i) {
  $('#pageRange').value = i;
  $('#pageNum').textContent = `${i + 1} / ${R.count}`;
  for (let j = Math.max(0, i - 2); j < Math.min(R.count, i + 6); j++) loadPage(j);
}
async function loadPage(j) {
  if (R.done.has(j) || R.busy.has(j)) return;
  R.busy.add(j);
  const src = R.src, d = R.pages[j];
  try {
    let el;
    if (src.type === 'img') {
      const f = src.files[j];
      el = new Image(); el.alt = ''; el.decoding = 'async';
      el.src = R.hq ? await fileLink(f) : thumb(f, '2048x1024');
      await el.decode().catch(() => {});
    } else {
      const page = await R.pdf.getPage(j + 1);
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const vp = page.getViewport({ scale: R.ph * dpr / page.getViewport({ scale: 1 }).height });
      el = document.createElement('canvas');
      el.width = vp.width; el.height = vp.height;
      await page.render({ canvasContext: el.getContext('2d'), viewport: vp }).promise;
    }
    if (src !== R.src || !d) return;
    d.querySelector('.pg-ph')?.remove();
    d.querySelector('img,canvas')?.remove();
    d.prepend(el);
    R.done.add(j);
  } catch (e) { console.warn('page', j, e); }
  finally { R.busy.delete(j); }
}
$('#btnPrev').onclick = () => R.pf?.flipPrev();
$('#btnNext').onclick = () => R.pf?.flipNext();
$('#pageRange').addEventListener('input', e => { const v = +e.target.value; R.pf?.turnToPage(v); onPage(v); });
$('#srcSel').addEventListener('change', e => loadSource(R.srcs[+e.target.value]));
$('#btnHQ').onclick = () => {
  R.hq = !R.hq; $('#btnHQ').classList.toggle('on', R.hq); R.done.clear();
  if (R.pf) onPage(R.pf.getCurrentPageIndex());
  toast(R.hq ? '已切換高畫質原圖（載入較慢）' : '已切換一般畫質');
};
$('#btnRInfo').onclick = () => R.w && openInfo(R.w);
$('#btnRClose').onclick = closeReader;
let rzT;
addEventListener('resize', () => {
  closeKebab();
  clearTimeout(rzT);
  rzT = setTimeout(() => {
    if (!$('#reader').classList.contains('open') || !R.pf) return;
    const cur = R.pf.getCurrentPageIndex();
    destroyFlip(); R.done.clear(); buildFlip(cur);
  }, 250);
});

/* ===================== 影片播放器 ===================== */
const P = { w: null, i: 0 };
const vid = $('#vid');
function plHTML() {
  return P.w.vid.map((f, i) => `<li><button class="pl-item ${i === P.i ? 'on' : ''}" data-act="pl" data-i="${i}">
    ${f.thumb ? `<img src="${thumb(f, '160x92')}" alt="" loading="lazy">` : '<i class="ti ti-movie"></i>'}
    <span>${esc(f.name.replace(/\.[^.]+$/, ''))}</span><small>${fmtSize(f.size)}</small></button></li>`).join('');
}
function renderPlaylist() {
  $('#plSide').innerHTML = plHTML();
  const inSheet = $('#sheetBody .pl-list');
  if (inSheet && $('#sheetOv').classList.contains('open')) inSheet.innerHTML = plHTML();
}
function openPlayer(w, i = 0) {
  closeKebab(); closeSheet();
  P.w = w; $('#pTitle').textContent = w.display;
  $('#player').classList.add('open'); syncLock();
  playAt(i);
}
async function playAt(i) {
  P.i = i; renderPlaylist();
  const f = P.w.vid[i];
  $('#pNow').textContent = `${i + 1} / ${P.w.vid.length} · ${f.name}`;
  try { vid.src = await fileLink(f); vid.play().catch(() => {}); }
  catch (e) { toast('取得影片連結失敗：' + e.message, 'err'); }
}
function closePlayer() {
  vid.pause(); vid.removeAttribute('src'); vid.load();
  $('#player').classList.remove('open'); syncLock();
}
vid.addEventListener('ended', () => { if (P.w && P.i < P.w.vid.length - 1) playAt(P.i + 1); });
vid.addEventListener('error', () => { if (vid.getAttribute('src')) toast('瀏覽器可能不支援這個影片格式（如 mkv、avi、wmv），可改用下載觀看', 'err'); });
$('#plSide').addEventListener('click', e => { const b = e.target.closest('[data-act="pl"]'); if (b) playAt(+b.dataset.i); });
$('#btnPl').onclick = () => openSheet(`<h3 class="sh-title">播放清單</h3><ul class="flist pl-list">${plHTML()}</ul>`, (act, i) => { if (act === 'pl') { playAt(i); closeSheet(); } });
$('#btnPInfo').onclick = () => P.w && openInfo(P.w);
$('#btnPClose').onclick = closePlayer;

/* ===================== 主列表與選單事件 ===================== */
function openWork(w) {
  if (!w) return;
  if (w.pdf.length || w.img.length) openReader(w);
  else if (w.vid.length) openPlayer(w, 0);
}
$('#list').addEventListener('click', e => {
  const kb = e.target.closest('.kebab');
  if (kb) { e.stopPropagation(); toggleKebab(kb, S.byId.get(kb.dataset.id)); return; }
  const head = e.target.closest('.acc-head');
  if (head && !head.closest('.sk-acc')) {
    const sec = head.closest('.acc'), n = sec.dataset.name, open = !sec.classList.contains('open');
    sec.classList.toggle('open', open); head.setAttribute('aria-expanded', open);
    open ? S.openSet.add(n) : S.openSet.delete(n);
    return;
  }
  const card = e.target.closest('.card');
  if (card) openWork(S.byId.get(card.dataset.id));
});
$('#list').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.classList.contains('card')) openWork(S.byId.get(e.target.dataset.id));
});
document.addEventListener('click', e => { if (!e.target.closest('#kmenu') && !e.target.closest('.kebab')) closeKebab(); });
addEventListener('scroll', closeKebab, { passive: true });

let qT;
$('#q').addEventListener('input', e => { clearTimeout(qT); qT = setTimeout(() => { S.q = e.target.value; if (S.works.length) render(); }, 150); });

function openDrawer() { $('#linkIn').value = S.link; $('#drawerOv').classList.add('open'); syncLock(); }
function closeDrawer() { $('#drawerOv').classList.remove('open'); syncLock(); }
$('#btnMenu').onclick = openDrawer;
$('#btnCloseDrawer').onclick = closeDrawer;
$('#drawerOv').addEventListener('click', e => { if (e.target.id === 'drawerOv') closeDrawer(); });
$('#sortSeg').addEventListener('click', e => {
  const b = e.target.closest('[data-sort]'); if (!b) return;
  S.sort = b.dataset.sort; store('sortMode', S.sort); render();
});
$('#btnExpand').onclick = () => { getGroups().forEach(g => S.openSet.add(g.name)); render(); };
$('#btnCollapse').onclick = () => { S.openSet.clear(); render(); };
$('#nameIndex').addEventListener('click', e => {
  const b = e.target.closest('.ni'); if (!b) return;
  const n = b.dataset.name;
  S.openSet.add(n); render(); closeDrawer();
  setTimeout(() => document.querySelector(`.acc[data-name="${CSS.escape(n)}"]`)?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 60);
});
$('#btnReload').onclick = () => {
  const v = $('#linkIn').value.trim();
  try { parseLink(v); } catch (e) { toast('連結格式不正確：' + e.message, 'err'); return; }
  S.link = v; store('pcloudLink', v); closeDrawer(); load();
};

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if ($('#kmenu').classList.contains('open')) return closeKebab();
    if ($('#sheetOv').classList.contains('open')) return closeSheet();
    if ($('#reader').classList.contains('open')) return closeReader();
    if ($('#player').classList.contains('open')) return closePlayer();
    if ($('#drawerOv').classList.contains('open')) return closeDrawer();
  }
  if ($('#reader').classList.contains('open') && !$('#sheetOv').classList.contains('open')) {
    if (e.key === 'ArrowRight') R.pf?.flipNext();
    if (e.key === 'ArrowLeft') R.pf?.flipPrev();
  }
});

/* ===================== 啟動 ===================== */
(function init() {
  document.title = CONFIG.siteTitle;
  $('#siteTitle').textContent = CONFIG.siteTitle;
  $('#footer').textContent = `${CONFIG.siteTitle} ${CONFIG.version} · 更新 ${CONFIG.updated}`;
  S.link = new URLSearchParams(location.search).get('link') || store('pcloudLink') || CONFIG.shareLink;
  S.sort = store('sortMode') || 'name-asc';
  if (!S.link) { openDrawer(); $('#list').innerHTML = '<div class="empty"><i class="ti ti-link"></i><p>在選單貼上 pCloud 公開資料夾連結</p></div>'; return; }
  load();
})();
</script>
</body>
</html>

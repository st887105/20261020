<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1014">
<meta name="referrer" content="no-referrer">
<title>我的電子書房</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{
  --bg:#0e1014;--panel:#161920;--card:#1c2029;--card2:#242935;--line:#2b303c;
  --text:#eceef3;--muted:#9aa3b4;--faint:#6b7385;
  --accent:#ff8a65;--accent-ink:#2a120a;--danger:#ff6b6b;
  --radius:14px;--shadow:0 12px 40px rgba(0,0,0,.5);--top:60px;--side:250px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select{font:inherit;color:inherit}
.icon-btn{width:40px;height:40px;border-radius:10px;display:inline-grid;place-items:center;font-size:22px;flex:none}
.icon-btn:hover,.icon-btn.on{background:var(--card2)}
.icon-btn.on{color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-size:14px}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn .ti{font-size:18px}
.avatar{width:34px;height:34px;border-radius:50%;background:rgba(255,138,101,.16);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:none;font-size:14px}
.avatar.sm{width:28px;height:28px;font-size:12px}

/* ===== 頂部列 ===== */
.topbar{position:sticky;top:0;z-index:30;height:var(--top);display:flex;align-items:center;gap:10px;padding:0 16px;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));background:rgba(14,16,20,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:20px;flex:none}
.brand b{display:block;font-size:16px;white-space:nowrap}
.brand small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.search{flex:1;max-width:440px;margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0 10px;height:40px}
.search .ti{color:var(--faint);font-size:18px}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:15px}
.search input::-webkit-search-cancel-button{display:none}
#btnSearch,#btnSearchClose{display:none}
/* 上傳 */
.drop{display:block;border:2px dashed var(--line);border-radius:14px;padding:24px 16px;text-align:center;color:var(--muted);cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:rgba(255,138,101,.06)}
.drop .ti{font-size:40px;color:var(--accent)}
.drop p{margin:8px 0 2px;color:var(--text);font-size:15px}
.drop small{font-size:12px}
.field{display:flex;flex-direction:column;gap:6px;margin-top:14px;font-size:13px;color:var(--muted)}
.field input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;outline:0;color:var(--text)}
.field input:focus{border-color:var(--accent)}
.up-prev{margin-top:8px;font-size:12px;color:var(--faint);word-break:break-all}
.uplist{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.uplist li{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:13px}
.uplist .top{display:flex;align-items:center;gap:8px}
.uplist .top span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uplist .top small{color:var(--faint);flex:none}
.uplist .st{flex:none;font-size:12px}.uplist .st.ok{color:#4cd39b}.uplist .st.err{color:var(--danger)}
.prog{height:4px;border-radius:2px;background:var(--line);margin-top:7px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
@media(max-width:640px){.topbar.searching #btnUpload{display:none}}

/* ===== 人名選項：手機橫向捲動標籤 ===== */
.chips{position:sticky;top:var(--top);z-index:20;display:none;gap:8px;overflow-x:auto;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:none;scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;white-space:nowrap;scroll-snap-align:start}
.chip small{color:var(--faint);font-size:11px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.chip.on small{color:var(--accent-ink)}

/* ===== 版面：桌機左側人名欄 + 右側作品 ===== */
.layout{display:grid;grid-template-columns:var(--side) minmax(0,1fr);gap:24px;max-width:1440px;margin:0 auto;padding:16px 20px 40px}
.side{position:sticky;top:calc(var(--top) + 16px);align-self:start;max-height:calc(100vh - var(--top) - 32px);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.side-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;font-size:13px;color:var(--muted)}
.side-list{overflow:auto;padding:0 8px 10px}
.pi{width:100%;display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;text-align:left;font-size:14px}
.pi:hover{background:var(--card)}
.pi.on{background:var(--card2);box-shadow:inset 3px 0 0 var(--accent)}
.pi .pn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pi small{color:var(--faint);font-size:12px}
.pi .avatar.all{background:var(--card2);color:var(--text)}

.toolbar{display:flex;align-items:center;gap:10px;margin:2px 0 14px;min-height:36px}
.back{display:inline-flex;align-items:center;gap:2px;padding:7px 10px 7px 6px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:13px;flex:none}
.back .ti{font-size:18px}
#btnMovePerson{padding:7px 10px;gap:4px}
@media(max-width:640px){#btnMovePerson span{display:none}}
/* 人名卡片 */
.pcard{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;outline:0;transition:transform .15s,border-color .15s}
@media(hover:hover){.pcard:hover{transform:translateY(-2px);border-color:var(--faint)}}
.pcard:focus-visible{border-color:var(--accent)}
.pcover{position:relative;aspect-ratio:1/1;background:#11141a;display:grid;place-items:center;overflow:hidden}
.pcover img{width:100%;height:100%;object-fit:cover;object-position:center 20%;display:block}
.pcover .avatar{width:64px;height:64px;font-size:26px}
.pcount{position:absolute;right:6px;top:6px;font-size:12px;padding:3px 9px;border-radius:999px;background:rgba(0,0,0,.7);color:#fff}
.pmeta{padding:10px 12px 12px}
.pmeta b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmeta small{display:block;color:var(--faint);font-size:12px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{flex:1;min-width:0;color:var(--muted);font-size:13px}
.stats b{color:var(--text);font-weight:600}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;flex:none}
.seg button{flex:1;padding:7px 10px;border-radius:7px;font-size:13px;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap}
.seg button .ti{font-size:17px}
.seg button.on{background:var(--card2);color:var(--text)}

/* ===== 圖卡 ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s;outline:0;display:flex;flex-direction:column}
@media(hover:hover){.card:hover{transform:translateY(-2px);border-color:var(--faint)}}
.card:focus-visible{border-color:var(--accent)}
.cover{position:relative;aspect-ratio:3/4;background:#11141a;display:grid;place-items:center;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .ph{font-size:44px;color:var(--faint)}
.bdgs{position:absolute;left:6px;bottom:6px;display:flex;gap:4px;flex-wrap:wrap}
.bdg{display:inline-flex;align-items:center;gap:3px;font-size:11px;padding:2px 7px;border-radius:999px;background:rgba(0,0,0,.68);color:#fff}
.bdg .ti{font-size:13px}
.bdg.pdf{color:#ffb4a2}.bdg.vid{color:#9ec5ff}
.cmeta{padding:9px 38px 10px 10px}
.cname{display:block;font-size:12px;color:var(--accent);font-weight:600;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctitle{font-size:13px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.csub{font-size:11px;color:var(--faint);margin-top:4px}
.kebab{position:absolute;right:3px;bottom:5px;width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-size:20px;color:var(--muted)}
.kebab:hover{background:var(--card2);color:var(--text)}

/* ===== Accordion 分組檢視 ===== */
.acc{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);margin-bottom:12px;scroll-margin-top:calc(var(--top) + 60px)}
.acc-head{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left;border-radius:var(--radius)}
.acc-title{min-width:0}
.acc-title b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc-title small{color:var(--muted);font-size:12px}
.chev{margin-left:auto;font-size:20px;color:var(--muted);transition:transform .25s}
.acc.open .chev{transform:rotate(180deg)}
.acc-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.acc.open .acc-body{grid-template-rows:1fr}
.acc-inner{overflow:hidden}
.acc .grid{padding:2px 14px 16px}

/* ===== Skeleton ===== */
.sk{display:block;border-radius:8px;background:linear-gradient(90deg,#1b1f27 25%,#272c38 37%,#1b1f27 63%);background-size:400% 100%;animation:sh 1.3s ease infinite}
@keyframes sh{0%{background-position:100% 0}100%{background-position:0 0}}
.sk-line{height:12px;margin:8px 10px 0;width:80%}
.sk-line.short{width:45%;margin-bottom:12px}
.sk-card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sk-cover{aspect-ratio:3/4;border-radius:0}
.sk-pi{height:34px;margin:6px 8px;border-radius:10px}
.sk-chip{width:72px;height:32px;border-radius:999px;flex:none}

.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty .ti{font-size:52px;color:var(--faint)}
.empty p{font-size:16px;color:var(--text)}
.empty .btn{margin-top:14px}
footer{text-align:center;color:var(--faint);font-size:12px;padding:0 16px 30px;padding-bottom:max(30px,env(safe-area-inset-bottom))}

/* ===== Hamburger 抽屜 ===== */
.drawer-ov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s}
.drawer-ov.open{opacity:1;pointer-events:auto}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(340px,88vw);background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .28s ease;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.drawer-ov.open .drawer{transform:none}
.dr-head{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 12px 18px;border-bottom:1px solid var(--line)}
.dr-head b{font-size:16px}
.dr-body{flex:1;overflow:auto}
.dr-sec{padding:14px 18px;border-bottom:1px solid var(--line)}
.dr-sec h4{margin:0 0 10px;font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.04em}
.dr-sec p{margin:8px 0 0;font-size:12px;color:var(--faint);line-height:1.6}
.dr-sec .seg{width:100%}
.row{display:flex;gap:8px}
.row .btn{flex:1}
.link-in,.txt-in{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;outline:0}
.link-in{margin-bottom:8px;font-size:13px}
.txt-in:focus,.link-in:focus{border-color:var(--accent)}

/* ===== Modal ===== */
.modal{position:fixed;inset:0;z-index:50;background:#08090c;display:none}
.modal.open{display:flex;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.mbox{width:100%;height:100vh;height:100dvh;display:flex;flex-direction:column}
.mtop{display:flex;align-items:center;gap:6px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top))}
.mtitle{flex:1;min-width:0;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:6px}
.mtop select{max-width:34vw;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 8px;font-size:13px}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:6px}
.flipbox{margin:auto}
.stage.zoomed{display:block;overflow:auto;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch}
.stage.zoomed .flipbox{pointer-events:none}
.zlabel{font-size:12px;color:var(--muted);min-width:40px;text-align:center;font-variant-numeric:tabular-nums;cursor:pointer}
.pdfframe{width:100%;height:100%;border:0;border-radius:8px;background:#fff}
.pdfcard>.ti{font-size:56px;color:var(--accent)}
.pdfcard .btn{min-height:46px}
.pdfcard p{margin:0;color:var(--text);line-height:1.5}
.pdfcard small{color:var(--muted)}
.pdfcard .btn{min-width:200px}
a.btn{text-decoration:none;color:var(--text)}
a.btn.primary{color:var(--accent-ink)}
.pdfcard .warn{max-width:320px;font-size:13px;line-height:1.6;color:#ffcf9e;background:rgba(255,138,101,.12);border:1px solid rgba(255,138,101,.35);border-radius:10px;padding:10px 12px}
.page{background:#0a0b0e;position:relative;overflow:hidden}
.page>img,.page>canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.pg-ph{position:absolute;inset:0;display:grid;place-items:center}
.pg-no{position:absolute;right:8px;bottom:6px;font-size:11px;color:rgba(255,255,255,.45);z-index:2}
.rbar{display:flex;align-items:center;gap:8px;padding:8px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.rbar input[type=range]{flex:1;min-width:0;accent-color:var(--accent);height:28px}
.pnum{font-size:13px;color:var(--muted);min-width:72px;text-align:center;font-variant-numeric:tabular-nums}
.loading{display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--muted);text-align:center;padding:20px}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
.spinner.sm{width:22px;height:22px;border-width:2px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== 影片播放器 ===== */
.pbody{flex:1;min-height:0;display:flex;gap:16px;padding:0 16px 16px;max-width:1400px;width:100%;margin:0 auto}
.vwrap{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:10px}
.vwrap video{width:100%;max-height:calc(100dvh - 150px);background:#000;border-radius:12px}
.pnow{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plside{width:300px;flex:none;overflow:auto;margin:0;padding:0;list-style:none;align-self:stretch}
.pl-item{width:100%;display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;text-align:left}
.pl-item:hover{background:var(--card)}
.pl-item.on{background:var(--card2);outline:1px solid var(--accent)}
.pl-item img,.pl-item>.ti{width:80px;height:46px;border-radius:6px;object-fit:cover;background:#000;flex:none;display:grid;place-items:center;font-size:22px;color:var(--faint)}
.pl-item span{flex:1;min-width:0;font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pl-item small{color:var(--faint);font-size:11px;flex:none}

/* ===== Bottom Sheet ===== */
.sheet-ov{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s}
.sheet-ov.open{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:620px;max-height:85dvh;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .3s ease;padding-bottom:env(safe-area-inset-bottom)}
.sheet.dragging{transition:none}
.sheet-ov.open .sheet{transform:none}
.handle{padding:12px 0 8px;display:grid;place-items:center;cursor:grab;touch-action:none}
.handle::before{content:"";width:42px;height:5px;border-radius:3px;background:var(--faint)}
.sheet-body{overflow:auto;padding:2px 18px 20px;overscroll-behavior:contain}
.sh-title{margin:2px 0 12px;font-size:17px;line-height:1.4}
.sh-sub{margin:16px 0 8px;font-size:13px;color:var(--muted);font-weight:500}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;word-break:break-word}
.flist{list-style:none;margin:0;padding:0}
.flist>li>button:not(.pl-item){width:100%;display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:10px;text-align:left;font-size:15px}
.flist>li>button:not(.pl-item):hover{background:var(--card)}
.flist>li>button .ti{font-size:20px;color:var(--muted)}
.flist span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flist small{color:var(--faint)}
.flist .avatar{flex:none;width:28px;height:28px;font-size:12px}
.sh-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.sh-actions .btn{flex:1;min-width:110px}
.namechips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

/* ===== Kebab（桌機浮動選單） ===== */
.kmenu{position:fixed;z-index:90;min-width:200px;background:var(--card2);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:none}
.kmenu.open{display:block;animation:fade .12s ease}
.kitem{width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;font-size:14px;text-align:left}
.kitem:hover{background:rgba(255,255,255,.06)}
.kitem .ti{font-size:18px;color:var(--muted)}

/* ===== Toast ===== */
.toasts{position:fixed;left:50%;bottom:max(24px,calc(env(safe-area-inset-bottom) + 12px));transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;width:max-content;max-width:92vw}
.toast{display:flex;align-items:center;gap:8px;background:#f2f3f6;color:#15171c;padding:10px 16px;border-radius:12px;font-size:14px;box-shadow:var(--shadow);animation:tin .25s ease}
.toast .ti{font-size:18px}
.toast.ok .ti{color:#14945f}.toast.err .ti{color:#d63c3c}
.toast.out{opacity:0;transform:translateY(8px);transition:.3s}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ===== 響應式 ===== */
@media(max-width:1100px){:root{--side:220px}.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}}
@media(max-width:899px){
  .layout{grid-template-columns:minmax(0,1fr);padding:12px 16px 32px}
  .side{display:none}
  .acc{scroll-margin-top:calc(var(--top) + 64px)}
  .plside{display:none}.pbody{padding:0 0 12px}.vwrap video{border-radius:0}.pnow{padding:0 14px}
}
@media(min-width:900px){#btnPl{display:none}}
@media(max-width:640px){

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script>
/* ===================== 設定區 ===================== */
const CONFIG = {
  // 預設讀取的 pCloud 公開資料夾連結（也可用網址 ?link=… 或選單裡貼上新連結）
  shareLink: 'https://e.pcloud.link/publink/show?code=kZQFzX7Z6lm7KwCuop5tnJBTjFP62VbsU2sk',
  siteTitle: '我的電子書房',
  // 不顯示的檔案
  exclude: /掃毒證明|簡介|說明|readme|\.(rtf|txt|nfo|url|db|ini|ds_store|rar|zip|7z)$/i,
  // 不顯示的資料夾或檔案（外流私密影像、私人照片、個人文件），就算放進雲端也不會出現在書房
  hide: /性愛|自拍|破解|流出|外流|偷拍|偷窺|私密影|我妹|^女友$|Estatement|對帳單|年終獎金|機密|^待你處理$|^重複備份$/i,
  // 固定的人名對照：'作品資料夾原名': '人名'
  // 在網頁上用「設定人名」改過後，選單 →「匯出對照」可複製一份貼到這裡，所有裝置就會一致
  nameOverrides: {},
  // 這些資料夾是「容器」，裡面每個子資料夾各自是一部作品
  containers: ['待確認', '合輯', '未分類'],
  // PDF 中轉站（Cloudflare Worker 網址）。填了之後 PDF 會變成翻頁電子書，任何瀏覽器都能看
  // 例：'https://pcloud-pdf.你的帳號.workers.dev'
  pdfProxy: 'https://pcloud-pdf.sunny-f0b.workers.dev',
  pdfProxyMaxBytes: 480 * 1024 * 1024,
  // 上傳：經由同一個中轉站送到寫真作品資料夾的「檔案請求連結」
  uploadSite: 'photo',
  uploadLink: 'https://e.pcloud.com/#/puplink?code=ij37ZRwed8TsIyVXbRMwKRinKg7uWH7nV',
  uploadMaxBytes: 100 * 1024 * 1024,
  version: 'v1.7.0',
  updated: '2026-10-22'
};

/* ===================== 工具 ===================== */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const coll = new Intl.Collator('zh-Hant-TW', { numeric: true, sensitivity: 'base' });
const RX = { img: /\.(jpe?g|png|webp|gif|bmp|avif)$/i, pdf: /\.pdf$/i, vid: /\.(mp4|m4v|mov|webm|mkv|avi|wmv|flv|ts|3gp|mpe?g)$/i };
const mqMobile = matchMedia('(max-width:640px)');
const S = { code: '', api: '', link: '', works: [], byId: new Map(), sort: 'name-asc', view: 'grid', person: '', q: '', openSet: new Set(), linkCache: new Map(), loaded: false };

function store(k, v) {
  try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; }
}
function fmtSize(b) {
  if (!b) return '—';
  const u = ['B','KB','MB','GB','TB']; let i = 0;
  while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
  return (i ? b.toFixed(b < 10 ? 1 : 0) : b) + ' ' + u[i];
}
function fmtDate(t) {
  if (!t) return '—';
  const d = new Date(t);
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
}
function syncLock() {
  document.body.classList.toggle('lock', !!document.querySelector('.modal.open,.drawer-ov.open,.sheet-ov.open'));
}
const initial = n => esc([...(n || '?')][0]);

/* ===================== Toast ===================== */
function toast(msg, type = '') {
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  const ic = type === 'err' ? 'ti-alert-circle' : type === 'ok' ? 'ti-circle-check' : 'ti-info-circle';
  t.innerHTML = `<i class="ti ${ic}"></i><span>${esc(msg)}</span>`;
  $('#toasts').appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 300); }, type === 'err' ? 4500 : 2600);
}

/* ===================== pCloud API ===================== */
function parseLink(link) {
  const u = new URL(link.trim());
  const code = u.searchParams.get('code');
  if (!code) throw new Error('連結裡找不到 code 參數');
  const eu = /^e\./i.test(u.hostname) || /eapi/i.test(u.hostname);
  return { code, api: eu ? 'https://eapi.pcloud.com' : 'https://api.pcloud.com' };
}
async function pc(method, params = {}) {
  const qs = new URLSearchParams({ code: S.code, ...params });
  const r = await fetch(`${S.api}/${method}?${qs}`, { referrerPolicy: 'no-referrer' });
  const j = await r.json();
  if (j.result !== 0) throw new Error(j.error || `pCloud 錯誤碼 ${j.result}`);
  return j;
}
// 縮圖：寬高需為 4 或 5 的倍數，上限 2048x1024
const thumb = (f, size = '320x480') =>
  `${S.api}/getpubthumb?${new URLSearchParams({ code: S.code, fileid: f.fileid, size, crop: '0' })}`;
async function fileLink(f, dl = false) {
  const key = f.fileid + (dl ? 'd' : '');
  if (S.linkCache.has(key)) return S.linkCache.get(key);
  const j = await pc('getpublinkdownload', dl ? { fileid: f.fileid, forcedownload: 1 } : { fileid: f.fileid });
  const url = 'https://' + j.hosts[0] + j.path;
  S.linkCache.set(key, url);
  return url;
}
const zipUrl = w =>
  `${S.api}/getpubzip?${new URLSearchParams({ code: S.code, folderid: w.folderid, filename: (w.display || 'download') + '.zip', forcedownload: 1 })}`;

/* ===================== 人名對照 ===================== */
function localNames() { try { return JSON.parse(store('nameOverrides') || '{}') || {}; } catch (e) { return {}; } }
function saveLocalNames(o) { store('nameOverrides', Object.keys(o).length ? JSON.stringify(o) : null); }
function overrideFor(title) { return localNames()[title] || CONFIG.nameOverrides[title] || ''; }

/* ===================== 資料整理 ===================== */
function kind(f) {
  const ct = f.contenttype || '';
  if (RX.pdf.test(f.name) || ct === 'application/pdf') return 'pdf';
  if (f.category === 2 || RX.vid.test(f.name) || ct.startsWith('video/')) return 'vid';
  if (f.category === 1 || RX.img.test(f.name) || ct.startsWith('image/')) return 'img';
  return null;
}
function collect(node, acc) {
  for (const c of node.contents || []) {
    if (CONFIG.hide.test(c.name) || c.name === '.thumb.stogram') continue;
    if (c.isfolder) collect(c, acc);
    else if (!CONFIG.exclude.test(c.name)) { const k = kind(c); if (k) acc[k].push(c); }
  }
  return acc;
}
function cleanTitle(t) {
  return t.replace(/\[[^\]]*\]|【[^】]*】|《[^》]*檔》|\([^)]*\)|（[^）]*）/g, ' ').replace(/\s+/g, ' ').trim();
}
const KW = /(數位|数位|數碼|電子|电子)?(寫真書|寫真集|写真集|写真書|寫真|写真|photo ?book)/i;
// 常見但不是人名的字
const STOP = /日本版|台灣版|中文版|付費|免費|特裝版|完全版|精華版|珍愛收藏版|珍藏版|收藏版|豪華增量版|數位典藏|個人|首本|居家|實體|实体|大尺|初體驗|私拍|已壓縮|\b\d+(st|nd|rd|th)\b|\d+\s*P\b/gi;
// 出版社、品牌前綴
const PUBLISHER = /^(?:JVID|XIUREN|秀人網?|Valent|Rion|\d+F|乃木坂46|爆机少女|爆機少女)\s*[-–—]?\s*/i;
// 日文新字體、簡體 → 繁體，讓「三上悠亜／三上悠亞」併成同一人
const VARIANT = { '亜':'亞','瀬':'瀨','戸':'戶','桜':'櫻','沢':'澤','斎':'齋','辺':'邊','浜':'濱','恵':'惠','栄':'榮','竜':'龍','広':'廣','気':'氣','楽':'樂','薫':'薰','湾':'灣','写':'寫','极':'極','实':'實','体':'體' };
const CJK2_4 = /^[㐀-鿿぀-ヿ]{2,4}$/;
function autoName(title) {
  const s = cleanTitle(title).replace(STOP, ' ');
  let name = '';
  const m = s.match(KW);
  if (m && m.index > 0) {
    // 關鍵字前面的幾段裡，挑「最短的 2–4 字人名」，同長取後面那個
    const segs = s.slice(0, m.index).split(/[《》「」『』\[\]【】:：|｜\-–—_\s，,、．.]+/).filter(Boolean);
    // 先看本身就是純中日文 2–4 字的段落，沒有才看去掉英文後的
    const pure = segs.map(x => x.replace(PUBLISHER, '')).filter(x => CJK2_4.test(x));
    const cands = pure.length ? pure : segs.map(x => canon(x)).filter(x => CJK2_4.test(x));
    if (cands.length) name = cands.reduce((a, c) => (c.length <= a.length ? c : a));
    else name = segs[0] || '';
  }
  if (!name) {
    const s2 = s.replace(/《[^》]*》|「[^」]*」|『[^』]*』/g, ' ').trim();
    name = (s2.split(/\s+[-–—|｜]\s+|[:：]|\s{2,}/)[0] || '').trim();
    // 「巫苡萱-天天和你在苡起」這種沒空白的分隔：挑出第一段像人名的
    if (/[-–—_]/.test(name)) {
      const parts = name.split(/[-–—_]+/).map(x => x.trim()).filter(Boolean);
      name = parts.find(x => CJK2_4.test(canon(x))) || parts[0] || name;
    }
    // 「樂樂 稀有三點全露」：取第一個詞
    const first = name.split(/\s+/)[0];
    if (first && /[㐀-鿿぀-ヿ]{2,}/.test(first)) name = first;
  }
  name = name.replace(/^[\s\-–—·・.,，]+|[\s\-–—·・.,，]+$/g, '');
  return canon(name) || cleanTitle(title) || title;
}
// 標題裡所有可能是人名的段落
function nameCands(title) {
  return [...new Set(cleanTitle(title).replace(STOP, ' ').replace(KW, ' ')
    .split(/[《》「」『』\[\]【】:：|｜\-–—_\s，,、．.]+/).map(x => canon(x)).filter(x => CJK2_4.test(x)))];
}
// 同一人不同寫法合併：「30F林襄」→ 林襄、「巫苡萱 Ava Wu」→ 巫苡萱、「倪暄＆曲羿」→ 倪暄、「痞幼1」→ 痞幼
function canon(n) {
  let s = String(n || '').trim().replace(/^\d+[.\s、]+/, '').replace(PUBLISHER, '');
  // 「與你‧YURI」：‧ 後面是英文名就用英文名
  const dot = s.split(/[‧·・]/);
  if (dot.length > 1 && /^[A-Za-z][A-Za-z\s]*$/.test(dot[dot.length - 1].trim())) s = dot[dot.length - 1].trim();
  s = s.split(/\s*[＆&、]\s*|(?<=[㐀-鿿])\s*[xX×]\s*(?=[㐀-鿿A-Za-z])/)[0];
  s = s.replace(/^[0-9]+[A-Za-z]*\s*(?=[㐀-鿿぀-ヿ])/, '');
  const cjk = s.match(/[㐀-鿿぀-ヿ]{2,}/g);
  if (cjk && /[A-Za-z]/.test(s)) s = cjk[0];
  s = s.replace(/\s*\d+$/, '');
  s = s.replace(/[亜瀬戸桜沢斎辺浜恵栄竜広気楽薫湾写极实体]/g, c => VARIANT[c]);
  return s.trim();
}
const SEP = /\s+[-–—－]\s+/;
// 「人名 - 作品名」格式
function splitTitle(t) {
  const parts = t.split(SEP);
  if (parts.length < 2) return null;
  let name = cleanTitle(parts[0]) || parts[0].trim();
  const work = parts.slice(1).join(' - ').trim();
  // 「JVID - 樂樂」：前面是品牌，人名在後面
  if (!name.replace(PUBLISHER, '').trim()) name = autoName(work);
  return name ? { name, work } : null;
}
function nameOf(title, folderName) {
  const sp = splitTitle(title)?.name;
  return overrideFor(title) || folderName || (sp ? canon(sp) || sp : '') || autoName(title);
}
function displayOf(title) {
  const sp = splitTitle(title);
  return (sp && sp.work) || cleanTitle(title) || title;
}
function medianRatio(files) {
  const r = files.filter(f => f.width && f.height).slice(0, 40).map(f => f.width / f.height).sort((a, b) => a - b);
  return r.length ? r[Math.floor(r.length / 2)] : 0.75;
}
// 網站上傳的檔案命名為「人名 - 作品名__原檔名」，同一個前綴的檔案合成一部作品
const UP_SEP = '__';
const upKey = f => { const i = f.name.indexOf(UP_SEP); return i > 0 ? f.name.slice(0, i).trim() : ''; };
function buildWorks(meta) {
  const works = [];
  const grouped = new Map(); // 前綴 → { acc, node, who }
  const toGroup = (f, who) => {
    const key = upKey(f), k = kind(f);
    if (!key || !k) return false;
    if (!grouped.has(key)) grouped.set(key, { acc: { img: [], pdf: [], vid: [] }, node: f, who });
    grouped.get(key).acc[k].push(f);
    return true;
  };
  const sorter = (a, b) => coll.compare(a.name, b.name);
  const add = (title, node, acc, person) => {
    acc.img.sort(sorter); acc.pdf.sort(sorter); acc.vid.sort(sorter);
    const all = [...acc.img, ...acc.pdf, ...acc.vid];
    if (!all.length) return;
    works.push({
      id: 'w' + works.length, title, display: displayOf(title), person: person || '', name: nameOf(title, person),
      folderid: node.isfolder ? node.folderid : null, file: node.isfolder ? null : node,
      img: acc.img, pdf: acc.pdf, vid: acc.vid,
      size: all.reduce((s, f) => s + (f.size || 0), 0),
      modified: Math.max(Date.parse(node.modified) || 0, ...all.map(f => Date.parse(f.modified) || 0)),
      cover: acc.img[0] || acc.vid.find(v => v.thumb) || acc.pdf.find(p => p.thumb) || null
    });
  };
  const empty = () => ({ img: [], pdf: [], vid: [] });
  if (!meta.isfolder) {
    const acc = empty(); const k = kind(meta); if (k) acc[k].push(meta);
    add(meta.name.replace(/\.[^.]+$/, ''), meta, acc);
    return works;
  }
  const rootImgs = empty();
  for (const c of meta.contents || []) {
    if (CONFIG.hide.test(c.name)) continue;
    if (c.isfolder) {
      const kids = (c.contents || []).filter(x => x.isfolder);
      const isPerson = (c.contents || []).some(x => splitTitle(x.name.replace(/\.[^.]+$/, ''))?.name === c.name.trim());
      const isContainer = CONFIG.containers.includes(c.name.trim());
      if (isPerson || isContainer) {
        // 人名資料夾：裡面每個子資料夾是一部作品；直接放在裡面的檔案歸成「其他」
        const loose = empty();
        const who = isPerson ? c.name.trim() : '';
        for (const x of c.contents || []) {
          if (CONFIG.hide.test(x.name)) continue;
          if (x.isfolder) { add(x.name, x, collect(x, empty()), who); continue; }
          if (CONFIG.exclude.test(x.name)) continue;
          if (toGroup(x, who)) continue;
          const k = kind(x); if (!k) continue;
          // PDF、影片：每個檔案各自是一部作品；零散圖片合成一本
          if (k === 'img') loose.img.push(x);
          else { const acc = empty(); acc[k].push(x); add(x.name.replace(/\.[^.]+$/, ''), x, acc, who); }
        }
        if (loose.img.length) add(c.name + ' - 其他', c, loose, who);
      } else add(c.name, c, collect(c, empty()));
      continue;
    }
    if (CONFIG.exclude.test(c.name)) continue;
    if (toGroup(c, '')) continue;
    const k = kind(c); if (!k) continue;
    if (k === 'img') rootImgs.img.push(c);
    else { const acc = empty(); acc[k].push(c); add(c.name.replace(/\.[^.]+$/, ''), c, acc); }
  }
  if (rootImgs.img.length) add(meta.name, meta, rootImgs);
  for (const [key, g] of grouped) add(key, g.node, g.acc, g.who);
  mergeNames(works);
  return works;
}
// 「艾融化你」含有已存在的人名「艾融」→ 歸到艾融（只處理自動判斷的人名）
function mergeNames(works) {
  const count = new Map();
  works.forEach(w => count.set(w.name, (count.get(w.name) || 0) + 1));
  // 標題裡如果出現別部作品已經用的人名，就歸到那個人（例：「襄水-林襄MIZUKI」→ 林襄）
  for (const w of works) {
    if (w.person || overrideFor(w.title) || count.get(w.name) > 1) continue;
    const known = nameCands(w.title).find(x => x !== w.name && count.get(x));
    if (known) { count.set(w.name, count.get(w.name) - 1); w.name = known; count.set(known, count.get(known) + 1); }
  }
  const names = [...count.keys()].filter(n => count.get(n) > 0);
  for (const w of works) {
    if (w.person || overrideFor(w.title)) continue;
    const hits = names.filter(a => a !== w.name && a.length >= 2 && w.name.length > a.length && w.name.startsWith(a));
    if (hits.length) w.name = hits.sort((x, y) => y.length - x.length)[0];
  }
}

/* 依搜尋、排序整理出「人」的清單 */
function getPeople() {
  const q = S.q.trim().toLowerCase();
  const list = S.works.filter(w => !q || w.name.toLowerCase().includes(q) || w.title.toLowerCase().includes(q));
  const m = new Map();
  for (const w of list) { if (!m.has(w.name)) m.set(w.name, []); m.get(w.name).push(w); }
  const g = [...m].map(([name, ws]) => ({
    name, works: ws.sort((a, b) => coll.compare(a.display, b.display)), latest: Math.max(...ws.map(w => w.modified))
  }));
  if (S.sort === 'name-asc') g.sort((a, b) => coll.compare(a.name, b.name));
  else if (S.sort === 'name-desc') g.sort((a, b) => coll.compare(b.name, a.name));
  else g.sort((a, b) => b.latest - a.latest);
  return g;
}

/* ===================== 載入 ===================== */
async function load() {
  S.loaded = false;
  showSkeleton();
  $('#folderName').textContent = '讀取雲端資料夾中…';
  try {
    const p = parseLink(S.link);
    S.code = p.code; S.api = p.api; S.linkCache.clear();
    const j = await pc('showpublink');
    S.works = buildWorks(j.metadata);
    S.byId = new Map(S.works.map(w => [w.id, w]));
    $('#folderName').textContent = j.metadata.name || 'pCloud 資料夾';
    S.openSet = new Set();
    const g = getPeople();
    g.slice(0, g.length <= 12 ? g.length : 3).forEach(x => S.openSet.add(x.name));
    S.loaded = true;
    render(); updateNameHint();
    toast(`已載入 ${g.length} 位、${S.works.length} 部作品`, 'ok');
  } catch (e) {
    console.error(e);
    $('#stats').textContent = ''; $('#sideList').innerHTML = ''; $('#chips').innerHTML = '';
    $('#folderName').textContent = '讀取失敗';
    $('#list').innerHTML = `<div class="empty"><i class="ti ti-cloud-off"></i><p>讀取雲端資料夾失敗</p><small>${esc(e.message)}</small><br><button class="btn primary" id="btnRetry"><i class="ti ti-refresh"></i>重試</button></div>`;
    $('#btnRetry').onclick = load;
    toast('讀取失敗：' + e.message, 'err');
  }
}

function kebabItems(w) {
  const items = [];

  if (w.vid.length) items.push(['ti-player-play', `播放影片（${w.vid.length}）`, () => openPlayer(w, 0)]);

let kOwner = null;

function toggleKebab(btn, w) {
  const items = kebabItems(w);
  if (mqMobile.matches) {

    openSheet(`<h3 class="sh-title">${esc(w.display)}</h3><ul class="flist">${items.map((it, i) =>

      (act, i) => { closeSheet(); items[i][2](); });
    return;
  }
  if (kOwner === btn) return closeKebab();

  m.innerHTML = items.map((it, i) => `<button class="kitem" role="menuitem" data-i="${i}"><i class="ti ${it[0]}"></i>${it[1]}</button>`).join('');
  m._items = items;
  m.classList.add('open');

  let x = r.right - m.offsetWidth, y = r.bottom + 6;

async function download(w) {

// works：要移動的作品（單一作品，或整個人的所有作品）
function openMove(works, fromName) {
  const isPerson = works.length > 1 || !!fromName;
  const current = fromName || works[0].name;
  const counts = new Map();
  S.works.forEach(x => counts.set(x.name, (counts.get(x.name) || 0) + 1));
  const names = [...counts.keys()].filter(n => n !== current).sort(coll.compare);
  const hasCustom = works.some(w => localNames()[w.title]);
  const title = isPerson ? `把「${esc(current)}」的 ${works.length} 部作品移到…` : `移動「${esc(works[0].display)}」`;
  openSheet(`<h3 class="sh-title">${title}</h3>
    <dl class="kv"><dt>目前人名</dt><dd>${esc(current)}</dd>${isPerson ? '' : `<dt>資料夾</dt><dd>${esc(works[0].title)}</dd>`}</dl>
    <h4 class="sh-sub">移到新的人名</h4>
    <div class="row"><input class="txt-in" id="moveNew" placeholder="輸入人名" autocomplete="off" enterkeyhint="done"><button class="btn primary" data-act="new" style="flex:none"><i class="ti ti-check"></i>移動</button></div>
    <h4 class="sh-sub">或選擇已有的人名（${names.length} 位）</h4>
    <input class="txt-in" id="moveFilter" type="search" placeholder="搜尋人名" autocomplete="off" style="margin-bottom:6px">
    <ul class="flist" id="moveList">${names.map(n => `<li data-n="${esc(n)}"><button data-act="pick" data-n="${esc(n)}"><span class="avatar sm">${initial(n)}</span><span>${esc(n)}</span><small>${counts.get(n)} 部</small></button></li>`).join('')}</ul>
    ${hasCustom ? '<div class="sh-actions"><button class="btn" data-act="reset"><i class="ti ti-arrow-back-up"></i>還原自動判斷</button></div>' : ''}`,
    (act, i, b) => {
      let target = '';
      if (act === 'pick') target = b.dataset.n;
      else if (act === 'new') { target = $('#moveNew').value.trim(); if (!target) { toast('請輸入人名', 'err'); $('#moveNew').focus(); return; } }
      const o = localNames();
      if (act === 'reset') works.forEach(w => delete o[w.title]);
      else if (target) works.forEach(w => { o[w.title] = target; });
      else return;
      saveLocalNames(o);
      S.works.forEach(x => { x.name = nameOf(x.title, x.person); }); mergeNames(S.works);
      closeSheet();
      if (S.person && !S.works.some(x => x.name === S.person)) S.person = act === 'reset' ? '' : target;
      if (S.person) history.replaceState({ person: S.person }, '');
      render(); updateNameHint();
      toast(act === 'reset' ? '已還原自動判斷' : `已移到「${target}」`, 'ok');
    });
}

const R = { pf: null, w: null, srcs: [], src: null, pages: [], ratio: .75, count: 0, ph: 0, pdf: null, pdfUrl: '', hq: false, zoom: 1, res: 1, busy: new Set(), done: new Set() };
function sourcesOf(w) {

function openReader(w, idx) {

  $('#reader').classList.remove('open'); syncLock();
}
const proxyUrl = f => `${CONFIG.pdfProxy.replace(/\/$/, '')}/?${new URLSearchParams({ code: S.code, fileid: f.fileid, api: S.api.includes('eapi') ? 'eu' : 'us', v: 3 })}`;

function ensurePdfJs() {
  if (window.pdfjsLib) return Promise.resolve();

    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload = () => { pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; res(); };
    s.onerror = () => { pdfReady = null; rej(new Error('PDF 閱讀元件載入失敗')); };
    document.head.appendChild(s);
  });
}
async function loadSource(src) {
  destroyFlip();
  if (R.pdf) { R.pdf.destroy(); R.pdf = null; }
  R.src = src; R.done.clear(); R.busy.clear(); R.hq = false; R.pdfUrl = '';
  $('#btnHQ').classList.remove('on'); $('#btnHQ').hidden = src.type !== 'img';
  $('#btnROpen').hidden = true;
  $('#rbar').hidden = src.type !== 'img';
  const stage = $('#stage');
  stage.innerHTML = '<div class="loading"><div class="spinner"></div><p>載入中…</p></div>';
  try {
    if (src.type === 'img') {
      R.ratio = medianRatio(src.files); R.count = src.files.length;
      buildFlip(0);
      return;
    }
    // PDF 有設定中轉站：用 PDF.js 做成翻頁電子書
    // pCloud 對約 500MB 以上的檔案不支援分段讀取，這種大檔直接開啟
    if (CONFIG.pdfProxy && (src.file.size || 0) < CONFIG.pdfProxyMaxBytes) try {
      await ensurePdfJs();
      const url = proxyUrl(src.file);
      const doc = await pdfjsLib.getDocument({ url, disableAutoFetch: true, rangeChunkSize: 1 << 20 }).promise;
      if (R.src !== src) { doc.destroy(); return; }
      R.pdf = doc; R.pdfUrl = url;
      const vp = (await doc.getPage(1)).getViewport({ scale: 1 });
      R.ratio = vp.width / vp.height; R.count = doc.numPages;
      $('#rbar').hidden = false;
      buildFlip(0);
      return;
    } catch (e) {
      console.warn('PDF 中轉失敗，改用直接開啟', e);
      if (R.src !== src) return;
      if (R.pdf) { R.pdf.destroy(); R.pdf = null; }
    }
    // 沒有中轉站：電腦用瀏覽器內建檢視器，手機交給系統開啟
    const url = await fileLink(src.file);
    if (R.src !== src) return;
    R.pdfUrl = url;
    const inApp = /Line\/|FBAN|FBAV|FB_IAB|Instagram|MicroMessenger|; wv\)/i.test(navigator.userAgent);
    const canInline = !inApp && !mqMobile.matches && !/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    stage.innerHTML = canInline
      ? `<iframe class="pdfframe" src="${esc(url)}" referrerpolicy="no-referrer" title="${esc(src.file.name)}"></iframe>`
      : `<div class="loading pdfcard"><i class="ti ti-file-type-pdf"></i><p>${esc(src.file.name)}</p><small>${fmtSize(src.file.size)}</small>
         ${(src.file.size || 0) >= CONFIG.pdfProxyMaxBytes ? '<div class="warn">這本 PDF 超過 480MB，pCloud 不支援分段讀取，沒辦法翻頁。點下面按鈕直接開啟，檔案很大，請用 Wi-Fi。</div>' : ''}
         ${inApp ? '<div class="warn">你現在是在 App 內建的瀏覽器（LINE、Facebook 等），這類瀏覽器打不開 PDF。請點右上角選單，選「用預設瀏覽器開啟」，改用 Chrome 或 Safari 再試一次。</div>' : ''}
         <a class="btn primary" href="${esc(url)}" target="_blank" rel="noreferrer noopener"><i class="ti ti-external-link"></i>開啟 PDF</a>
         <a class="btn" href="${esc(S.link)}" target="_blank" rel="noopener"><i class="ti ti-cloud"></i>改到 pCloud 觀看</a>
         <small>連結約 1 小時後失效，失效請重新開啟這本</small></div>`;
  } catch (err) {
    console.error(err);
    if (R.src !== src) return;
    stage.innerHTML = `<div class="loading"><i class="ti ti-alert-triangle" style="font-size:42px;color:var(--danger)"></i><p>載入失敗</p><small>${esc(err.message)}</small></div>`;
    toast('載入失敗：' + err.message, 'err');
  }
}
function buildFlip(start = 0) {
  const stage = $('#stage'); stage.innerHTML = '';
  R.zoom = 1; R.res = 1; stage.classList.remove('zoomed'); $('#zoomLabel').textContent = '100%';
  const aw = stage.clientWidth - 12, ah = stage.clientHeight - 12, r = R.ratio;
  const spread = R.count > 1 && aw > 700 && aw >= ah * r * 2 * 0.8;
  let ph = spread ? Math.min(ah, aw / 2 / r) : Math.min(ah, aw / r);
  const pw = Math.floor(ph * r); ph = Math.floor(ph); R.ph = ph;
  const box = document.createElement('div');
  box.className = 'flipbox';
  box.style.width = (spread ? pw * 2 : pw) + 'px';
  box.style.height = ph + 'px';
  stage.appendChild(box);
  R.pages = [];
  for (let i = 0; i < R.count; i++) {
    const d = document.createElement('div');
    d.className = 'page';
    d.innerHTML = `<div class="pg-ph"><div class="spinner sm"></div></div><span class="pg-no">${i + 1}</span>`;
    box.appendChild(d); R.pages.push(d);
  }
  R.pf = new St.PageFlip(box, {
    width: pw, height: ph, size: 'fixed', autoSize: false, showCover: spread, usePortrait: true,
    mobileScrollSupport: false, maxShadowOpacity: .4, flippingTime: 600, startPage: start, swipeDistance: 20
  });
  R.pf.loadFromHTML(R.pages);
  R.pf.on('flip', e => { onPage(e.data); if (R.zoom > 1) { stage.scrollTop = 0; } });
  $('#pageRange').max = R.count - 1;
  onPage(start);
}
function onPage(i) {
  $('#pageRange').value = i;
  $('#pageNum').textContent = `${i + 1} / ${R.count}`;
  for (let j = Math.max(0, i - 2); j < Math.min(R.count, i + 6); j++) loadPage(j);
}
async function loadPage(j) {
  if (R.done.has(j) || R.busy.has(j)) return;
  R.busy.add(j);
  const src = R.src, d = R.pages[j];
  try {
    let el;
    if (src.type === 'img') {
      const f = src.files[j];
      el = new Image(); el.alt = ''; el.decoding = 'async'; el.referrerPolicy = 'no-referrer';
      el.src = R.hq ? await fileLink(f) : thumb(f, '2048x1024');
      await el.decode().catch(() => {});
    } else {
      const page = await R.pdf.getPage(j + 1);
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const vp = page.getViewport({ scale: R.ph * dpr * R.res / page.getViewport({ scale: 1 }).height });
      el = document.createElement('canvas');
      el.width = vp.width; el.height = vp.height;
      await page.render({ canvasContext: el.getContext('2d'), viewport: vp }).promise;
    }
    if (src !== R.src || !d) return;
    d.querySelector('.pg-ph')?.remove();
    d.querySelector('img,canvas')?.remove();
    d.prepend(el);
    R.done.add(j);
  } catch (e) { console.warn('page', j, e); }
  finally { R.busy.delete(j); }
}

/* 放大縮小：按鈕、雙擊、Ctrl+滾輪、雙指縮放、鍵盤 + − 0 */
const ZMIN = 1, ZMAX = 4;
let zT;
function setZoom(z, cx, cy) {
  const box = $('#stage .flipbox'); if (!box || !R.pf) return;
  const stage = $('#stage');
  z = Math.round(Math.min(ZMAX, Math.max(ZMIN, z)) * 100) / 100;
  if (z === R.zoom) return;
  // 以指定點（預設畫面中心）為中心縮放
  const r = stage.getBoundingClientRect();
  const px = (cx ?? r.left + r.width / 2) - r.left, py = (cy ?? r.top + r.height / 2) - r.top;
  const ox = (stage.scrollLeft + px) / R.zoom, oy = (stage.scrollTop + py) / R.zoom;
  R.zoom = z;
  box.style.zoom = z;
  stage.classList.toggle('zoomed', z > 1);
  if (z > 1) { stage.scrollLeft = ox * z - px; stage.scrollTop = oy * z - py; }
  $('#zoomLabel').textContent = Math.round(z * 100) + '%';
  // 放大後換成清晰版：圖片改載原圖，PDF 用較高解析度重繪
  clearTimeout(zT);
  zT = setTimeout(() => {
    const need = z >= 1.5;
    if (R.src?.type === 'img' && need && !R.hq) { R.hq = true; $('#btnHQ').classList.add('on'); R.done.clear(); onPage(R.pf.getCurrentPageIndex()); }
    if (R.src?.type === 'pdf') { const res = Math.min(3, Math.max(1, Math.ceil(z))); if (res !== R.res) { R.res = res; R.done.clear(); onPage(R.pf.getCurrentPageIndex()); } }
  }, 350);
}
$('#btnZoomIn').onclick = () => setZoom(R.zoom * 1.25);
$('#btnZoomOut').onclick = () => setZoom(R.zoom / 1.25);

$('#stage').addEventListener('dblclick', e => { if (R.pf) setZoom(R.zoom > 1 ? 1 : 2, e.clientX, e.clientY); });
$('#stage').addEventListener('wheel', e => {
  if (!R.pf || !(e.ctrlKey || e.metaKey)) return;
  e.preventDefault(); setZoom(R.zoom * (e.deltaY < 0 ? 1.1 : 1 / 1.1), e.clientX, e.clientY);
}, { passive: false });
(() => {
  let d0 = 0, z0 = 1, lastTap = 0;
  const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  const mid = t => [(t[0].clientX + t[1].clientX) / 2, (t[0].clientY + t[1].clientY) / 2];
  const st = $('#stage');
  st.addEventListener('touchstart', e => {
    if (e.touches.length === 2) { d0 = dist(e.touches); z0 = R.zoom; }
    else if (e.touches.length === 1) {
      const now = Date.now();
      if (now - lastTap < 300 && R.pf) { e.preventDefault(); setZoom(R.zoom > 1 ? 1 : 2, e.touches[0].clientX, e.touches[0].clientY); lastTap = 0; }
      else lastTap = now;
    }
  }, { passive: false });
  st.addEventListener('touchmove', e => {
    if (e.touches.length !== 2 || !d0) return;
    e.preventDefault();
    const [x, y] = mid(e.touches);
    setZoom(z0 * dist(e.touches) / d0, x, y);
  }, { passive: false });
  st.addEventListener('touchend', e => { if (e.touches.length < 2) d0 = 0; });
})();

const safeName = s => s.replace(/[\\/:*?"<>|]/g, ' ').replace(/\s+/g, ' ').trim();
function upPrefix() {
  const who = safeName($('#upWho')?.value || ''), work = safeName($('#upWork')?.value || '');
  return who && work ? `${who} - ${work}` : '';
}
function openUpload() {
  closeDrawer(); closeKebab();
  const names = S.loaded ? [...new Set(S.works.map(w => w.name))].sort(coll.compare) : [];
  openSheet(`<h3 class="sh-title">上傳作品到「寫真作品」</h3>
    <label class="drop" id="drop">
      <i class="ti ti-cloud-upload"></i>
      <p>點這裡選檔案，或把檔案拖進來</p>
      <small>圖片、PDF、影片都可以，一次可選多個，每個 ${fmtSize(CONFIG.uploadMaxBytes)} 以內</small>
      <input type="file" id="upInput" multiple accept="image/*,.pdf,video/*,.mkv,.avi,.wmv" hidden>
    </label>
    <div class="field"><span>人名</span><input id="upWho" list="upNames" placeholder="例如：江宛庭" value="${esc(S.person || '')}" autocomplete="off"><datalist id="upNames">${names.map(n => `<option value="${esc(n)}">`).join('')}</datalist></div>
    <div class="field"><span>作品名稱（這次選的檔案會合成同一部作品）</span><input id="upWork" placeholder="例如：宛美情人" value="上傳${today()}" autocomplete="off"></div>
    <div class="up-prev" id="upPrev"></div>
    <ul class="uplist" id="uplist"></ul>
    <div class="sh-actions">
      <button class="btn primary" data-act="go" id="btnUpGo" disabled><i class="ti ti-upload"></i>開始上傳</button>
      <a class="btn" href="${esc(CONFIG.uploadLink)}" target="_blank" rel="noopener"><i class="ti ti-external-link"></i>大檔改用 pCloud</a>
    </div>`, act => { if (act === 'go') startUpload(); });
  UP.files = [];
  const inp = $('#upInput'), drop = $('#drop');
  inp.onchange = () => { addUpFiles(inp.files); inp.value = ''; };
  ['dragenter', 'dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => addUpFiles(e.dataTransfer.files));
  ['#upWho', '#upWork'].forEach(sel => $(sel).addEventListener('input', drawUpList));
  drawUpList();
}
function addUpFiles(list) {
  for (const f of list) {
    if (!upKind(f.name)) { toast(`「${f.name}」不是圖片、PDF 或影片，已略過`, 'err'); continue; }
    if (f.size > CONFIG.uploadMaxBytes) { toast(`「${f.name}」超過 ${fmtSize(CONFIG.uploadMaxBytes)}，請改用 pCloud 上傳頁`, 'err'); continue; }
    if (UP.files.some(x => x.f.name === f.name && x.f.size === f.size)) continue;
    UP.files.push({ f, state: 'wait', pct: 0 });
  }
  drawUpList();
}
function drawUpList() {
  const pre = upPrefix();
  $('#upPrev').textContent = pre ? `上傳後的檔名：${pre}${UP_SEP}原檔名` : '請填人名和作品名稱';
  $('#uplist').innerHTML = UP.files.map(x => {
    const k = upKind(x.f.name);
    const st = x.state === 'ok' ? '完成' : x.state === 'err' ? '失敗' : x.state === 'up' ? x.pct + '%' : '等待中';
    return `<li><div class="top"><i class="ti ${k === 'vid' ? 'ti-movie' : k === 'pdf' ? 'ti-file-type-pdf' : 'ti-photo'}"></i><span>${esc(x.f.name)}</span><small>${fmtSize(x.f.size)}</small>
      <span class="st ${x.state === 'ok' ? 'ok' : x.state === 'err' ? 'err' : ''}">${st}</span></div><div class="prog"><i style="width:${x.state === 'ok' ? 100 : x.pct}%"></i></div></li>`;
  }).join('');
  const b = $('#btnUpGo');
  if (b) b.disabled = UP.busy || !pre || !UP.files.some(x => x.state === 'wait' || x.state === 'err');
}
function uploadOne(x, pre) {
  return new Promise(resolve => {
    const fd = new FormData();
    fd.append('file', x.f, `${pre}${UP_SEP}${safeName(x.f.name)}`);
    const xhr = new XMLHttpRequest();
    xhr.open('POST', `${CONFIG.pdfProxy.replace(/\/$/, '')}/upload?${new URLSearchParams({ site: CONFIG.uploadSite, names: '電子書房' })}`);
    xhr.upload.onprogress = e => { if (e.lengthComputable) { x.pct = Math.round(e.loaded / e.total * 100); drawUpList(); } };
    xhr.onload = () => {
      let ok = false;
      try { ok = xhr.status === 200 && JSON.parse(xhr.responseText).result === 0; } catch (e) {}
      if (!ok) console.warn('upload', xhr.status, xhr.responseText);
      x.state = ok ? 'ok' : 'err'; drawUpList(); resolve(ok);
    };
    xhr.onerror = () => { x.state = 'err'; drawUpList(); resolve(false); };
    x.state = 'up'; x.pct = 0; drawUpList();
    xhr.send(fd);
  });
}
async function startUpload() {
  const pre = upPrefix();
  if (UP.busy || !pre) return;
  UP.busy = true; drawUpList();
  let ok = 0, bad = 0;
  for (const x of UP.files) {
    if (x.state === 'ok') continue;
    (await uploadOne(x, pre)) ? ok++ : bad++;
  }
  UP.busy = false; drawUpList();
  if (ok) toast(`已上傳 ${ok} 個檔案${bad ? `，${bad} 個失敗` : ''}`, bad ? '' : 'ok');
  else if (bad) toast('上傳失敗，可改用 pCloud 上傳頁', 'err');
  if (ok) setTimeout(load, 1500);
}
$('#btnUpload').onclick = openUpload;
$('#btnUploadDrawer').onclick = openUpload;

/* ===================== 啟動 ===================== */
(function init() {
  document.title = CONFIG.siteTitle;
  $('#siteTitle').textContent = CONFIG.siteTitle;
  $('#footer').textContent = `${CONFIG.siteTitle} ${CONFIG.version} · 更新 ${CONFIG.updated}`;
  S.link = new URLSearchParams(location.search).get('link') || store('pcloudLink') || CONFIG.shareLink;
  S.sort = store('sortMode') || 'name-asc';
  S.view = store('viewMode2') || 'people';
  if (!S.link) { openDrawer(); $('#list').innerHTML = '<div class="empty"><i class="ti ti-link"></i><p>在選單貼上 pCloud 公開資料夾連結</p></div>'; return; }
  load();
})();
</script>
</body>
</html>
